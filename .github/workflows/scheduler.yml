# Runs the RankPilot scheduler every 15 minutes (Vercel Hobby crons run once a day).
# Setup: repo Settings → Secrets and variables → Actions:
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
# The workflow does nothing until both secrets exist.
name: scheduler
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"
